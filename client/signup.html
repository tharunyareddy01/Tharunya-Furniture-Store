
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - Tharunya Furniture</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="auth-body">

    <div class="auth-container">

        <!-- LEFT SIDE -->

        <div class="auth-image">

            <div class="auth-image-content">

                <div class="auth-logo">
                    🪑
                </div>

                <h1>
                    Tharunya Furniture
                </h1>

                <p>
                    Create your account and
                    start shopping for your home.
                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="auth-form-container">

            <a
                href="index.html"
                class="back-link"
            >
                ← Back to Home
            </a>

            <div class="auth-form">

                <p class="section-label">
                    CREATE ACCOUNT
                </p>

                <h2>
                    Sign Up
                </h2>

                <p class="auth-subtitle">
                    Create your customer account
                </p>


                <form id="signupForm">

                    <!-- NAME -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <!-- MESSAGE -->

                    <div
                        id="signupMessage"
                        class="form-message"
                    ></div>


                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Create Account
                    </button>

                </form>


                <div class="auth-divider">
                    <span>OR</span>
                </div>


                <p class="auth-bottom-text">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="js/signup.js"></script>

</body>

</html>
