
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Tharunya Furniture</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="auth-body">

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-image">

            <div class="auth-image-content">

                <div class="auth-logo">
                    🪑
                </div>

                <h1>
                    Tharunya Furniture
                </h1>

                <p>
                    Beautiful furniture for
                    beautiful homes.
                </p>

            </div>

        </div>


        <!-- Login Form -->
        <div class="auth-form-container">

            <a
                href="index.html"
                class="back-link"
            >
                ← Back to Home
            </a>

            <div class="auth-form">

                <p class="section-label">
                    WELCOME BACK
                </p>

                <h2>
                    Login to Your Account
                </h2>

                <p class="auth-subtitle">
                    Enter your details to continue
                </p>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <div
                        id="loginMessage"
                        class="form-message"
                    ></div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Login
                    </button>

                </form>


                <div class="auth-divider">
                    <span>OR</span>
                </div>


                <p class="auth-bottom-text">

                    Don't have an account?

                    <a href="signup.html">
                        Create Account
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
